@if (commercial) {
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Riansares 4R - Inicio">
        <img src="/img/logo-web-riansares-4R.png" alt="Logotipo de Riansares 4R">
        <span>Riansares 4R</span>
      </a>
      <nav class="main-nav" [attr.aria-label]="i.t('page.main_navigation')">
        <a href="/#trabajos">{{i.language()==='es'?'Trabajos':'Our work'}}</a>
        <a href="/#servicios">{{i.language()==='es'?'Servicios':'Services'}}</a>
        <a href="/#contacto">{{i.language()==='es'?'Contacto':'Contact'}}</a>
        <select [value]="i.language()" (change)="s.language($any($event.target).value)" id="languageSelect" [attr.aria-label]="i.t('page.language')"><option value="es">ES</option><option value="en">EN</option></select>
      </nav>
    </div>
  </header>
} @else {
<header class="site-header">
  <div class="shell nav-shell">
    <a class="brand" href="https://athagon.tech/" aria-label="A Athagon Labs">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-name">ATHAGON</span>
      <span class="brand-labs">LABS</span>
    </a>
    <select [value]="i.language()" (change)="s.language($any($event.target).value); closeMenu()" id="languageSelect" [attr.aria-label]="i.t('page.language')"><option value="es" aria-label="Español">🇪🇸 ES</option><option value="en" aria-label="English">🇬🇧 EN</option></select>
    <button #menuButton id="menuToggle" class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="mainNavigation" [attr.aria-label]="i.t('menu')" (click)="menuOpen.set(!menuOpen())">☰</button>
    <nav id="mainNavigation" class="nav" [class.is-open]="menuOpen()" (click)="closeMenu()" [attr.aria-label]="i.t('page.main_navigation')">
      <a href="#demo">Demo</a>
      <a href="#como-funciona">{{ i.t('page.what_it_demonstrates_nav') }}</a>
      <a href="#arquitectura">{{ i.t('page.architecture_nav') }}</a>
      <a href="https://github.com/germanux/r4r-spring-ai-rag" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>

}
