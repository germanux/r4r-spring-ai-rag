services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: r4r-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backup:/backup
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - r4r-network

  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: r4r-postgres-test
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:?required}
      POSTGRES_USER: ${POSTGRES_TEST_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    # Both servers listen on 5432 inside the container.
    # 5433 is published on the NAS to avoid collision with production.
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_TEST_PORT}:5432"
    volumes:
      - ./postgres-test-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - r4r-network

  api:
    image: r4r-api:0.3.1
    container_name: r4r-api
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    restart: unless-stopped
    mem_limit: 1024m
    networks:
      - r4r-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: r4r-cloudflared
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - r4r-network

networks:
  r4r-network:
    driver: bridge
