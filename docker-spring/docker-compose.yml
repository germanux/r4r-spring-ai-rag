services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: r4r-postgres
    env_file:
      - ./r4r.env
      # Production: Standard port published only on the Synology LAN IP.
      # Before changing the current port 55434, check that 5432 is free.
    ports:
      - "192.168.1.203:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backup:/backup
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r4r -d r4r_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - r4r-network

  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: r4r-postgres-test
    # Reuse r4r.env, incluiding POSTGRES_PASSWORD of production.
    env_file:
      - ./r4r.env
    # Only database and user are changed for tests.
    environment:
      POSTGRES_DB: r4r_rag_test
      POSTGRES_USER: r4r_test
    # Both servers listen on 5432 inside the container.
    # 5433 is published on the NAS to avoid collision with production.
    ports:
      - "192.168.1.203:5433:5432"
    volumes:
      - ./postgres-test-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r4r_test -d r4r_rag_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - r4r-network

  api:
    image: r4r-api:0.3.1
    container_name: r4r-api
    env_file:
      - ./r4r.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    restart: unless-stopped
    mem_limit: 1024m
    networks:
      - r4r-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: r4r-cloudflared
    env_file:
      - ./r4r.env
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - r4r-network

networks:
  r4r-network:
    driver: bridge
