[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r4r-orchestrator"
version = "0.1.0"
description = "Small deterministic runner for one bounded OpenCode/Codex cycle"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
r4r-cycle = "r4r_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
