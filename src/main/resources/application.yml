spring:
  config:
    # Spring Boot treats the docker-spring/.env as a Java properties file.
    # Operating-system environment variables still override these values.
    import: optional:file:./docker-spring/.env[.properties]
  application:
    name: r4r-spring-ai-rag
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      # GenerationRouter owns both generation providers; do not create a global ChatModel.
      chat: none
    ollama:
      chat:
        think: false
        options:
          model: ${RAG_PC_GENERATION_MODEL:qwen3:8b}
          keep-alive: 3h
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL:nomic-embed-text:latest}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${RAG_EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        schema-validation: true

r4r:
  rag:
    openai:
      enabled: ${RAG_OPENAI_ENABLED:false}
      model: ${RAG_OPENAI_MODEL:gpt-6-luna}
    stream:
      timeout: ${RAG_SSE_TIMEOUT:180s}
      heartbeat-interval: ${RAG_SSE_HEARTBEAT_INTERVAL:10s}
    embedding:
      base-url: ${RAG_EMBEDDING_BASE_URL:http://192.168.1.203:11434}
      connect-timeout: ${RAG_EMBEDDING_CONNECT_TIMEOUT:2s}
      read-timeout: ${RAG_EMBEDDING_READ_TIMEOUT:30s}
    warmup:
      min-interval: ${RAG_WARMUP_MIN_INTERVAL:1m}
      pc-timeout: ${RAG_WARMUP_PC_TIMEOUT:60s}
      laptop-timeout: ${RAG_WARMUP_LAPTOP_TIMEOUT:60s}
      embedding-timeout: ${RAG_WARMUP_EMBEDDING_TIMEOUT:30s}
    generation:
      pc-base-url: ${RAG_PC_OLLAMA_BASE_URL:http://192.168.1.207:11434}
      pc-model: ${RAG_PC_GENERATION_MODEL:qwen3:8b}
      fallback-base-url: ${RAG_FALLBACK_OLLAMA_BASE_URL:http://192.168.1.209:11434}
      fallback-model: ${RAG_FALLBACK_GENERATION_MODEL:qwen2.5:7b}
      connect-timeout: 2s
      probe-timeout: 2s
      fallback-read-timeout: ${RAG_FALLBACK_READ_TIMEOUT:60s}
    retrieval:
      top-k: 3
      min-score: 0.63
  api-security:
    # Protección ligera para la demo pública. No sustituye autenticación real.
    enabled: ${RAG_API_SECURITY_ENABLED:true}
    allowed-origins:
      - ${RAG_API_ALLOWED_ORIGIN_PUBLIC:https://athagon.tech}
      - ${RAG_API_ALLOWED_ORIGIN_LOCALHOST:http://localhost:63342}
      - ${RAG_API_ALLOWED_ORIGIN_LOOPBACK:http://127.0.0.1:63342}
      - ${RAG_API_ALLOWED_ORIGIN_PYTHON_LOCALHOST:http://localhost:8000}
      - ${RAG_API_ALLOWED_ORIGIN_PYTHON_LOOPBACK:http://127.0.0.1:8000}
      - ${RAG_API_ALLOWED_ORIGIN_SYNOX_NAS:http://192.168.1.203}
      - ${RAG_API_ALLOWED_ORIGIN_SYNOX_NAS_S:https://192.168.1.203}
    # Ejemplos válidos: 20s, 5s, 1m, 500ms.
    min-interval: ${RAG_API_MIN_INTERVAL:20s}
    # true = un POST sin Origin (por ejemplo curl/Postman sin cabecera Origin) recibe 403.
    require-origin: ${RAG_API_REQUIRE_ORIGIN:true}
    # Activar solo detrás de Cloudflare/reverse proxy de confianza; entonces se usa
    # CF-Connecting-IP y, como fallback, X-Forwarded-For para limitar por IP real.
    trust-proxy-headers: ${RAG_API_TRUST_PROXY_HEADERS:false}
    # Cota de memoria para IP activas dentro de la ventana del rate limit.
    max-tracked-ips: ${RAG_API_MAX_TRACKED_IPS:10000}
  catalog-on-startup: false
  knowledge:
    root: ${RAG_KNOWLEDGE_PATH}
    max-file-bytes: ${RAG_MAX_FILE_BYTES}
    max-chunk-chars: ${RAG_MAX_CHUNK_CHARS}
