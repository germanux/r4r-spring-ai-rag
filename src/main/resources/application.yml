spring:
  config:
    # Later imports win. The private file is optional and never versioned.
    import:
      - optional:file:./docker-spring/.env.base[.properties]
      - optional:file:./docker-spring/.env[.properties]
  application:
    name: r4r-spring-ai-rag
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      # GenerationRouter owns both generation providers; do not create a global ChatModel.
      chat: none
    ollama:
      chat:
        think: ${RAG_GENERATION_THINK}
        options:
          keep-alive: 3h
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${RAG_EMBEDDING_DIMENSIONS}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        schema-validation: true

r4r:
  rag:
    openai:
      read-timeout: ${RAG_OPENAI_READ_TIMEOUT}
      max-calls-per-day: ${RAG_OPENAI_MAX_CALLS_PER_DAY}
      enabled: ${RAG_OPENAI_ENABLED}
      model: ${RAG_OPENAI_MODEL}
    stream:
      timeout: ${RAG_SSE_TIMEOUT}
      heartbeat-interval: ${RAG_SSE_HEARTBEAT_INTERVAL}
    embedding:
      # Providers are derived from RAG_EMBEDDING_PROVIDERS by PublicRagEnvironment.
      connect-timeout: ${RAG_EMBEDDING_CONNECT_TIMEOUT}
      probe-timeout: ${RAG_EMBEDDING_PROBE_TIMEOUT}
      total-timeout: ${RAG_EMBEDDING_TOTAL_TIMEOUT}
      dimensions: ${spring.ai.vectorstore.pgvector.dimensions}
      expected-digest: ${RAG_EMBEDDING_EXPECTED_DIGEST}
    warmup:
      on-startup: ${RAG_WARMUP_ON_STARTUP}
      min-interval: ${RAG_WARMUP_MIN_INTERVAL}
    generation:
      # Local URLs/models are derived from RAG_GENERATION_PROVIDERS.
      connect-timeout: ${RAG_GENERATION_CONNECT_TIMEOUT}
      probe-timeout: ${RAG_GENERATION_PROBE_TIMEOUT}
      translation-read-timeout: ${RAG_TRANSLATION_READ_TIMEOUT}
    retrieval:
      top-k: ${RAG_TOP_K}
      min-score: ${RAG_MIN_SCORE}
    vector:
      primary: ${RAG_VECTOR_PRIMARY}
      failover-enabled: ${RAG_VECTOR_FAILOVER_ENABLED}
      s3vectors:
        enabled: ${RAG_S3_VECTORS_ENABLED}
        region: ${RAG_S3_VECTORS_REGION}
        bucket: ${RAG_S3_VECTORS_BUCKET}
        index: ${RAG_S3_VECTORS_INDEX}
        connect-timeout: ${RAG_S3_VECTORS_CONNECT_TIMEOUT}
        api-call-attempt-timeout: ${RAG_S3_VECTORS_ATTEMPT_TIMEOUT}
        api-call-timeout: ${RAG_S3_VECTORS_CALL_TIMEOUT}
  api-security:
    # Protección ligera para la demo pública. No sustituye autenticación real.
    enabled: ${RAG_API_SECURITY_ENABLED}
    # One allowlist, shared by MVC CORS and the consumption-security filter.
    # Ejemplos válidos: 20s, 5s, 1m, 500ms.
    max-global-requests-per-minute: ${RAG_API_GLOBAL_REQUESTS_PER_MINUTE}
    min-interval: ${RAG_API_MIN_INTERVAL}
    # true = un POST sin Origin (por ejemplo curl/Postman sin cabecera Origin) recibe 403.
    require-origin: ${RAG_API_REQUIRE_ORIGIN}
    # Activar solo detrás de Cloudflare/reverse proxy de confianza; entonces se usa
    # CF-Connecting-IP y, como fallback, X-Forwarded-For para limitar por IP real.
    trust-proxy-headers: ${RAG_API_TRUST_PROXY_HEADERS}
    # Cota de memoria para IP activas dentro de la ventana del rate limit.
    max-tracked-ips: ${RAG_API_MAX_TRACKED_IPS}
  catalog-on-startup: ${RAG_CATALOG_ON_STARTUP}
  knowledge:
    root: ${RAG_KNOWLEDGE_PATH}
    max-file-bytes: ${RAG_MAX_FILE_BYTES}
    max-chunk-chars: ${RAG_MAX_CHUNK_CHARS}
