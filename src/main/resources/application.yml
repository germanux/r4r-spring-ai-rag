spring:
  config:
    # Spring Boot treats the project-local .env as a Java properties file.
    # Operating-system environment variables still override these values.
    import: optional:file:./.env[.properties]
  application:
    name: r4r-spring-ai-rag
  datasource:
    url: ${RAG_DB_URL}
    username: ${RAG_DB_USER}
    password: ${RAG_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${RAG_OLLAMA_BASE_URL}
      chat:
        options:
          model: ${RAG_GENERATION_MODEL}
      embedding:
        options:
          model: ${RAG_EMBEDDING_MODEL}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${RAG_EMBEDDING_DIMENSIONS}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        schema-validation: true

r4r:
  rag:
    retrieval:
      top-k: 5
      min-score: 0.64
  api-security:
    # Protección ligera para la demo pública. No sustituye autenticación real.
    enabled: ${RAG_API_SECURITY_ENABLED:true}
    allowed-origins:
      - ${RAG_API_ALLOWED_ORIGIN_PUBLIC:https://athagon.tech}
      - ${RAG_API_ALLOWED_ORIGIN_LOCALHOST:http://localhost:63342}
      - ${RAG_API_ALLOWED_ORIGIN_LOOPBACK:http://127.0.0.1:63342}
    # Ejemplos válidos: 20s, 5s, 1m, 500ms.
    min-interval: ${RAG_API_MIN_INTERVAL:20s}
    # true = un POST sin Origin (por ejemplo curl/Postman sin cabecera Origin) recibe 403.
    require-origin: ${RAG_API_REQUIRE_ORIGIN:true}
    # Activar solo detrás de Cloudflare/reverse proxy de confianza; entonces se usa
    # CF-Connecting-IP y, como fallback, X-Forwarded-For para limitar por IP real.
    trust-proxy-headers: ${RAG_API_TRUST_PROXY_HEADERS:false}
    # Cota de memoria para IP activas dentro de la ventana del rate limit.
    max-tracked-ips: ${RAG_API_MAX_TRACKED_IPS:10000}
  catalog-on-startup: false
  knowledge:
    root: ${RAG_KNOWLEDGE_PATH}
    max-file-bytes: ${RAG_MAX_FILE_BYTES}
    max-chunk-chars: ${RAG_MAX_CHUNK_CHARS}
