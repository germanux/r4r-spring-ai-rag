spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.JdbcMetricsAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/r4r_rag_test
    username: r4r_test
    password: r4r_test_local_only
    driver-class-name: org.postgresql.Driver
    initialize: false
  flyway:
    enabled: false

r4r:
  catalog-on-startup: false
  knowledge:
    root: /tmp/r4r-knowledge-test
    max-file-bytes: 10485760
    max-chunk-chars: 2000
