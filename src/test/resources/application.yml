spring:
  config:
    # Carga el .env del proyecto también al ejecutar tests.
    import: optional:file:./.env[.properties]

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.JdbcMetricsAutoConfiguration

  datasource:
    # Todos los tests que necesiten PostgreSQL usan la BBDD de test, nunca la real.
    url: ${RAG_TEST_DB_URL}
    username: ${RAG_TEST_DB_USER}
    password: ${RAG_TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        schema-validation: true

r4r:
  catalog-on-startup: false
  knowledge:
    root: /tmp/r4r-knowledge-test
    max-file-bytes: 10485760
    max-chunk-chars: 2000
