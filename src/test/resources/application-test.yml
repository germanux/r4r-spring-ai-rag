spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.JdbcMetricsAutoConfiguration

  datasource:
    # Todos los tests que necesiten PostgreSQL usan la BBDD de test, nunca la real.
    url: jdbc:postgresql://${POSTGRES_HOST:192.168.1.203}:${POSTGRES_TEST_PORT:5433}/${POSTGRES_TEST_DB:r4r_rag_test}
    username: ${POSTGRES_TEST_USER:r4r_test}
    password: offline-test-password
    # Only the explicit PostgreSQL integration annotation selects the real driver.
    driver-class-name: com.riansares.r4r.config.TestDatabaseGuard$NoExternalJdbcDriver

r4r:
  rag:
    warmup:
      on-startup: false
  # Mantener el comportamiento previo de los tests HTTP sin Origin.
  api-security:
    enabled: false
  catalog-on-startup: false
  knowledge:
    root: /tmp/r4r-knowledge-test
    max-file-bytes: 10485760
    max-chunk-chars: 2000
