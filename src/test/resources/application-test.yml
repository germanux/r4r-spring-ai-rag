spring:
  datasource:
    url: ${RAG_TEST_DB_URL}
    username: ${RAG_TEST_DB_USER}
    password: ${RAG_TEST_DB_PASSWORD}
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store
        schema-validation: true
