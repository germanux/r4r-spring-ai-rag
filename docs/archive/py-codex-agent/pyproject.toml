[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r4r-codex-agent"
version = "0.3.0"
description = "Automatic bounded task controller using Codex planning/review and OpenCode implementation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
r4r-codex-agent = "r4r_codex_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
