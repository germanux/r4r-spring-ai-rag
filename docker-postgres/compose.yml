services:
  postgres-app:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: ${POSTGRES_APP_CONTAINER:?POSTGRES_APP_CONTAINER is required}
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB:?POSTGRES_APP_DB is required}
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    ports:
      - "${POSTGRES_APP_PORT:?POSTGRES_APP_PORT is required}:5432"
    volumes:
      - ./data/app:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres-test:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: ${POSTGRES_TEST_CONTAINER:?POSTGRES_TEST_CONTAINER is required}
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB is required}
      POSTGRES_USER: ${POSTGRES_TEST_USER:?POSTGRES_TEST_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD is required}
    ports:
      - "${POSTGRES_TEST_PORT:?POSTGRES_TEST_PORT is required}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
